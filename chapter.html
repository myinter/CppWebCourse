<!-- 首帧前套用已保存的主题/模式，避免深色页闪一下白 -->
<script>
(function () {
  try {
    var t = localStorage.getItem('pyt.theme');
    if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    var m = localStorage.getItem('pyt.mode') || 'self';
    document.documentElement.setAttribute('data-mode', m);
    if (m === 'teach') document.documentElement.style.setProperty('--scale-mode', '1.14');
  } catch (e) {}
})();
</script>
</head>
<body>

<main class="deck" id="deck" role="main" aria-label="课程内容"></main>

  <div class="loading-inner">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">正在载入本章内容…</div>
  </div>
</div>
